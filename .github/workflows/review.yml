name: Submit review

# Manual only. One run submits at most one review.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do (submit sends one review immediately)'
        type: choice
        required: true
        default: submit
        options:
          - submit     # walk the flow for real, once
          - dry-run    # walk the flow with all non-GET requests blocked
          - inspect    # dump the form structure + screenshot, click nothing
      choice:
        description: 'Which sentiment button to click'
        type: choice
        required: true
        default: 'Very Unsatisfied'
        options:
          - 'Very Unsatisfied'
          - 'Unsatisfied'
          - 'Satisfied'
          - 'Very Satisfied'
      comment:
        description: 'Your review text (used if the next step offers a comment box)'
        type: string
        required: false
        default: 'The food is consistently bland and unimaginative, and there is no meaningful choice at the counter. We are told what we are eating rather than asked. For a service we are effectively required to use, that is not acceptable.'
      url:
        description: 'Rating page URL'
        type: string
        required: true
        default: 'https://kwikrate.com/rate/be65d074-6580-4663-a0fa-016717d7da89'

permissions:
  contents: read

# One run at a time, and never cancel a run mid-submit.
concurrency:
  group: submit-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Inspect the form
        if: inputs.mode == 'inspect'
        env:
          REVIEW_URL: ${{ inputs.url }}
        run: npm run inspect

      - name: Walk the flow without submitting
        if: inputs.mode == 'dry-run'
        env:
          REVIEW_URL: ${{ inputs.url }}
          REVIEW_CHOICE: ${{ inputs.choice }}
          REVIEW_COMMENT: ${{ inputs.comment }}
          SUBMIT: 'false'
        run: npm run submit

      - name: Submit one review
        if: inputs.mode == 'submit'
        env:
          REVIEW_URL: ${{ inputs.url }}
          REVIEW_CHOICE: ${{ inputs.choice }}
          REVIEW_COMMENT: ${{ inputs.comment }}
          SUBMIT: 'true'
        run: npm run submit

      - name: Upload screenshots and page dumps
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: review-${{ inputs.mode }}-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 7
