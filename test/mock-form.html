<!doctype html>
<!-- Stand-in for the real KwikRate page, mirroring the structure that
     scripts/inspect.mjs found: four sentiment buttons on step one, with the
     comment box and submit button only appearing on step two. -->
<html lang="en">
<head><meta charset="utf-8"><title>Kwikrate</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
  .choices { display: flex; gap: .75rem; flex-wrap: wrap; }
  .choices button { display: flex; flex-direction: column; align-items: center;
    border: 2px solid #d1d5db; border-radius: .5rem; padding: 1rem 1.25rem; font: inherit;
    background: #fff; cursor: pointer; }
  .choices button.picked { border-color: #dc2626; background: #fef2f2; }
  #step2 { display: none; margin-top: 2rem; }
  textarea { width: 100%; height: 7rem; font: inherit; padding: .5rem; }
  #done { display: none; color: #2a7; font-weight: 600; margin-top: 2rem; }
</style></head>
<body>
  <h1>How was your experience?</h1>
  <div class="choices" id="step1">
    <button type="button">Very Satisfied</button>
    <button type="button">Satisfied</button>
    <button type="button">Unsatisfied</button>
    <button type="button">Very Unsatisfied</button>
  </div>

  <div id="step2">
    <p>Tell us more</p>
    <textarea name="comment" placeholder="What went wrong?"></textarea>
    <p><button type="button" id="send">Submit</button></p>
  </div>

  <p id="done">Thanks for your feedback!</p>

<script>
  // Mirrors the live page's shape: choosing creates the record and returns its
  // id, submitting PATCHes the comment onto that id. Read-back then re-fetches
  // it by id.
  let recordId = null;

  document.querySelectorAll('#step1 button').forEach(b => b.addEventListener('click', async () => {
    const picked = b.textContent.trim();
    document.querySelectorAll('#step1 button').forEach(o => o.classList.toggle('picked', o === b));
    document.getElementById('step2').style.display = 'block';

    // Stand-in for the Cloudflare RUM beacon the live page fires, so the
    // telemetry filtering is exercised rather than assumed.
    send('POST', '/cdn-cgi/rum?', { t: 'nav' });

    const created = await send('POST', '/rest/v1/ratings?select=*', { choice: picked });
    if (created && created[0]) recordId = created[0].id;
  }));

  document.getElementById('send').addEventListener('click', async () => {
    const comment = document.querySelector('textarea').value;
    await send('PATCH', '/rest/v1/ratings?id=eq.' + recordId, { comment });
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('done').style.display = 'block';
  });

  async function send(method, path, payload) {
    try {
      const res = await fetch(path, {
        method,
        headers: { 'content-type': 'application/json', apikey: 'test-anon-key' },
        body: JSON.stringify(payload),
      });
      if (res.status === 204) return null;
      return await res.json();
    } catch (e) {
      console.log('request failed (blocked or offline):', method, path);
      return null;
    }
  }
</script>
</body></html>
